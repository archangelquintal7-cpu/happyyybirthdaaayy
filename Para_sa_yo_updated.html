<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para sa’yo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap">
<style>
:root{
  --bg:#f2d5d8; --back:#d9788c; --front:#ecaab6; --bottom:#e0909f; --flap:#e89aa9;
  --seal:#b3213f; --paper:#fffaf3; --ink:#4a2430; --hint:#7a3a4b; --ui:#fffaf3; --uitext:#3b2230;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark; --bg:#241621; --paper:#f6ead9; --ink:#3b2230; --hint:#e8b4c0; --ui:#3a2433; --uitext:#fbe9ee;
  }
}
:root[data-theme="dark"]{color-scheme:dark; --bg:#241621; --paper:#f6ead9; --ink:#3b2230; --hint:#e8b4c0; --ui:#3a2433; --uitext:#fbe9ee}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:"Caveat","Segoe Script",cursive}
.amb{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.amb span{position:absolute;bottom:-40px;left:var(--x);font-size:var(--s);color:var(--c);opacity:0;animation:fl var(--d) linear var(--dl) infinite}
@keyframes fl{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.4}100%{transform:translateY(-115vh) rotate(25deg);opacity:0}}
.env{position:relative;z-index:1;width:300px;height:200px;perspective:900px;cursor:pointer;outline:none;margin-top:-60px}
.env:focus-visible{outline:3px solid var(--seal);outline-offset:14px;border-radius:6px}
.env.open{cursor:default}
.back{position:absolute;inset:0;background:var(--back);border-radius:6px;z-index:1;box-shadow:0 18px 30px rgba(0,0,0,.22)}
.pocket,.bottom,.flap{position:absolute;left:0;width:100%}
.pocket{top:0;height:100%;background:var(--front);z-index:3;clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%);border-radius:6px}
.bottom{top:0;height:100%;background:var(--bottom);z-index:3;clip-path:polygon(0 100%,50% 47%,100% 100%);border-radius:6px}
.flap{top:0;height:105px;background:var(--flap);z-index:4;transform-origin:top center;clip-path:polygon(0 0,100% 0,50% 100%);transition:transform .9s cubic-bezier(.45,0,.2,1),z-index 0s .45s}
.open .flap{transform:rotateX(180deg);z-index:1}
.seal{position:absolute;left:50%;top:100px;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--seal);color:#ffe3e8;z-index:6;display:flex;align-items:center;justify-content:center;font-size:26px;line-height:1;box-shadow:0 3px 8px rgba(0,0,0,.3);transition:opacity .5s,transform .5s;animation:beat 1.6s ease-in-out infinite}
.open .seal{opacity:0;transform:scale(.3);animation:none}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
.letter{position:absolute;left:50%;top:8px;width:min(340px,88vw);height:360px;z-index:2;transform-origin:top center;transform:translate(-50%,0) scale(.5);background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .3 0 0 0 0 .1 0 0 0 .2 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),radial-gradient(ellipse at 18% 12%,rgba(255,244,210,.75),transparent 55%),radial-gradient(circle at 88% 85%,rgba(139,94,40,.4),transparent 45%),radial-gradient(circle at 8% 92%,rgba(120,80,30,.3),transparent 32%),#e8d2a0;color:#4b3320;padding:18px 26px;box-sizing:border-box;border-radius:3px 7px 4px 8px/7px 3px 8px 4px;overflow:auto;box-shadow:inset 0 0 38px rgba(120,72,22,.6),inset 0 0 5px rgba(80,45,15,.6),0 4px 14px rgba(0,0,0,.25);transition:transform .9s ease-in-out}
.letter::before{content:"♥ ♥ ♥";display:block;text-align:center;color:var(--seal);letter-spacing:.4em;font-size:1.1rem;opacity:.75;margin-bottom:4px}
.letter::after{content:"♥";position:absolute;right:-14px;bottom:-30px;font-size:150px;color:var(--seal);opacity:.07;pointer-events:none}
.letter p{margin:0 0 .55em;font-size:1.4rem;line-height:1.25;font-weight:500}
.letter .sign{font-weight:700;font-size:1.4rem;color:var(--seal)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.peek{font-family:inherit;font-size:1.2rem;font-weight:700;background:#8b2a2f;color:#f6e6c8;border:0;border-radius:999px;padding:3px 14px;cursor:pointer;box-shadow:0 2px 5px rgba(60,20,10,.35);animation:beat 1.8s ease-in-out infinite}
.peek:focus-visible{outline:3px solid #8b2a2f;outline-offset:3px}
.gal{position:fixed;inset:0;z-index:60;background:rgba(30,15,20,.84);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:gin .4s ease}
.gal[hidden]{display:none}
@keyframes gin{from{opacity:0}to{opacity:1}}
.galbody{display:flex;align-items:center;gap:6px;max-width:100%}
.gn,.gx{background:none;border:0;color:#fbe9ee;font-size:44px;cursor:pointer;line-height:1;padding:8px}
.gx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;font-size:28px}
.gn:focus-visible,.gx:focus-visible{outline:3px solid #ff9eb3;border-radius:8px}
.gc{color:#fbe9ee;font:700 1.5rem Caveat,cursive}
.pol{background:#f4ead2;padding:12px 12px 8px;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 18px rgba(130,90,40,.35);transform:rotate(var(--r,-2deg));animation:pin .55s cubic-bezier(.2,.7,.3,1);width:min(300px,64vw,calc((100vh - 300px)*.8))}
@keyframes pin{from{opacity:0;transform:translateY(22px) rotate(calc(var(--r,-2deg) - 6deg)) scale(.94)}to{opacity:1;transform:rotate(var(--r,-2deg))}}
.pol img,.pol .ph{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;filter:sepia(.35) contrast(.95)}
.pol .ph{display:flex;align-items:center;justify-content:center;font-size:80px;color:#c58b7a;border:2px dashed #b99a6a;box-sizing:border-box;background:#eadcbc;filter:none}
.pol .cap{font:700 1.4rem Caveat,cursive;color:#5a3d28;text-align:center;min-height:2rem;padding-top:6px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.th{width:56px;height:56px;border-radius:8px;border:0;background-size:cover;background-position:center;color:#fff;font-size:18px;text-shadow:0 0 4px #000;cursor:pointer}
.note{font-size:13px;opacity:.75;margin:8px 0 0}
.fw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.galbody,.gc{position:relative;z-index:1}
.hb{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8%);left:0;right:0;text-align:center;z-index:2;pointer-events:none;font:700 clamp(2.6rem,11vw,4.6rem) Caveat,"Segoe Script",cursive;color:#ff69b4;text-shadow:0 0 14px rgba(255, 60, 255, 0.8),0 0 34px rgba(255,90,120,.55);animation:hbin 1s cubic-bezier(.2,.9,.3,1.3) both}
.hb[hidden]{display:none}
@keyframes hbin{from{opacity:0;transform:scale(.4) translateY(20px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.gal,.pol,.peek,.hb{animation:none}}
.rise .letter{transform:translate(-50%,-190px) scale(.5);transition:transform .95s cubic-bezier(.2,.7,.3,1)}
.front .letter{z-index:5}
.read .letter{transform:translate(-50%,-88px) scale(1);transition:transform 1.1s cubic-bezier(.45,0,.2,1)}
.hint,.again{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:inherit;font-size:1.6rem;font-weight:700;color:var(--hint);transition:opacity .4s}
.hint{top:calc(100% + 30px)}
.open .hint{opacity:0;pointer-events:none}
.again{top:calc(100% + 96px);background:none;border:2px solid var(--hint);border-radius:999px;padding:2px 18px;cursor:pointer;opacity:0;pointer-events:none;z-index:7}
.read .again{opacity:1;pointer-events:auto;transition-delay:.6s}
.h{position:fixed;z-index:20;pointer-events:none;line-height:1;will-change:transform,opacity}
.edit{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;font:600 15px system-ui,sans-serif;background:var(--ui);color:var(--uitext);border:0;border-radius:999px;padding:9px 16px;box-shadow:0 2px 10px rgba(0,0,0,.2);cursor:pointer}
.sheet{position:fixed;z-index:40;left:0;right:0;bottom:0;max-height:78%;overflow:auto;background:var(--ui);color:var(--uitext);border-radius:18px 18px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 18px);box-shadow:0 -8px 30px rgba(0,0,0,.3);font:15px system-ui,sans-serif;box-sizing:border-box;max-width:520px;margin:0 auto}
.sheet[hidden]{display:none}
.sheet label{display:block;font-weight:600;margin:12px 0 5px}
.sheet input,.sheet textarea{width:100%;box-sizing:border-box;font:16px system-ui,sans-serif;padding:10px;border-radius:10px;border:1.5px solid #c9a0aa;background:#fff;color:#3b2230}
.sheet textarea{min-height:130px;resize:vertical}
.sw{display:flex;gap:10px}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw button[aria-pressed="true"]{border-color:var(--uitext)}
.done{margin-top:16px;width:100%;font:600 16px system-ui,sans-serif;padding:12px;border:0;border-radius:12px;background:#b3213f;color:#fff;cursor:pointer}
.edit:focus-visible,.done:focus-visible,.sw button:focus-visible,.again:focus-visible{outline:3px solid #b3213f;outline-offset:3px}
@media (prefers-reduced-motion:reduce){
  .flap,.letter,.seal,.hint,.again{transition-duration:.01ms!important;transition-delay:0s!important}
  .seal{animation:none}.amb{display:none}
}
</style>
</head>
<body>
<div class="amb" id="amb" aria-hidden="true"></div>
<button class="edit" id="editBtn" type="button">♥ I-customize</button>

<div class="env" id="env" role="button" tabindex="0" aria-expanded="false" aria-label="Buksan ang sobre">
  <div class="back"></div>
  <div class="letter" id="letter"></div>
  <div class="pocket"></div>
  <div class="bottom"></div>
  <div class="flap"></div>
  <div class="seal" aria-hidden="true">♥</div>
  <div class="hint">Pindutin ang sobre</div>
  <button class="again" id="again" type="button">Isara ulit</button>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-label="I-customize ang sulat">
  <label for="fTo">Para kay</label>
  <input id="fTo" maxlength="40" placeholder="Pangalan niya">
  <label for="fMsg">Mensahe</label>
  <textarea id="fMsg" maxlength="700" placeholder="Isulat ang laman ng sulat mo"></textarea>
  <label for="fFrom">Mula kay</label>
  <input id="fFrom" maxlength="40" placeholder="Pangalan mo">
  <label>Kulay ng sobre</label>
  <div class="sw" id="sw"></div>
  <label for="fPics">Mga litrato (hanggang 8)</label>
  <input id="fPics" type="file" accept="image/*" multiple>
  <div class="thumbs" id="thumbs"></div>
  <p class="note">Naka-save lang ito sa device mo. Para makita ng iba, ibigay mo sa akin ang mga litrato at ilalagay ko sa page.</p>
  <button class="done" id="done" type="button">Tapos na</button>
</div>

<div class="gal" id="gal" hidden role="dialog" aria-label="Mga litrato">
  <button class="gx" id="galClose" type="button" aria-label="Isara">✕</button>
  <canvas class="fw" id="fw" aria-hidden="true"></canvas>
  <div class="hb" id="hb" hidden>Happy Birthday ♥</div>
  <div class="galbody"><button class="gn" id="galPrev" type="button" aria-label="Nakaraan">‹</button><div id="galFrame"></div><button class="gn" id="galNext" type="button" aria-label="Susunod">›</button></div>
  <div class="gc" id="galCount"></div>
</div>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var env=$('env'), letter=$('letter'), sheet=$('sheet');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var palettes={
    rose:{a:'#d9788c',b:'#ecaab6',c:'#e0909f',d:'#e89aa9',s:'#b3213f',n:'Rosas'},
    lavender:{a:'#9b86c9',b:'#c3b4e6',c:'#b09fd8',d:'#b8a6e0',s:'#6a3fb0',n:'Lila'},
    peach:{a:'#e59a6e',b:'#f5c4a3',c:'#eba982',d:'#f0b38f',s:'#c2410c',n:'Peach'},
    sea:{a:'#6fb3a8',b:'#a6d8cf',c:'#8cc7bc',d:'#96cdc3',s:'#1f7a6c',n:'Berde'}
  };
  var def={to:'Mahal',msg:'Hindi ko alam kung paano sasabihin nang maayos, kaya sinulat ko na lang.\nSalamat sa lahat ng tawa, sa kwentuhan, at sa pag-intindi mo. Ikaw ang paborito kong parte ng bawat araw.\nMahal kita. ♥',from:'ako',pal:'rose',photos:[]};
  var data=Object.assign({},def);
  try{var s=localStorage.getItem('sobre-data'); if(s) data=Object.assign(data,JSON.parse(s));}catch(e){}
  try{var ph=localStorage.getItem('sobre-photos'); if(ph) data.photos=JSON.parse(ph);}catch(e){}

  function render(){
    letter.textContent='';
    function add(t,c){var p=document.createElement('p'); if(c)p.className=c; p.textContent=t; letter.appendChild(p);}
    add('Para kay '+(data.to||'')+',');
    String(data.msg||'').split(/\n+/).forEach(function(l){if(l.trim())add(l)});
    var foot=document.createElement('div'); foot.className='foot';
    var pk=document.createElement('button'); pk.type='button'; pk.className='peek'; pk.textContent='♥ Pindutin ito';
    pk.addEventListener('click',function(e){e.stopPropagation();openGal()});
    var sg=document.createElement('span'); sg.className='sign'; sg.textContent='— '+(data.from||'');
    foot.appendChild(pk); foot.appendChild(sg); letter.appendChild(foot);
    var p=palettes[data.pal]||palettes.rose, r=document.documentElement.style;
    r.setProperty('--back',p.a); r.setProperty('--front',p.b); r.setProperty('--bottom',p.c);
    r.setProperty('--flap',p.d); r.setProperty('--seal',p.s);
    document.querySelectorAll('#sw button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.p===data.pal)});
    try{var c=Object.assign({},data); delete c.photos; localStorage.setItem('sobre-data',JSON.stringify(c));}catch(e){}
    renderThumbs();
  }
  // swatches
  Object.keys(palettes).forEach(function(k){
    var b=document.createElement('button'); b.type='button'; b.dataset.p=k;
    b.style.background=palettes[k].a; b.setAttribute('aria-label',palettes[k].n);
    b.addEventListener('click',function(){data.pal=k;render()}); $('sw').appendChild(b);
  });
  [['fTo','to'],['fMsg','msg'],['fFrom','from']].forEach(function(x){
    var el=$(x[0]); el.value=data[x[1]];
    el.addEventListener('input',function(){data[x[1]]=el.value;render()});
  });
  $('editBtn').addEventListener('click',function(){sheet.hidden=!sheet.hidden});
  $('done').addEventListener('click',function(){sheet.hidden=true});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){sheet.hidden=true; gal.hidden=true; stopFW();}});
  render();

  // gallery
  var gal=$('gal'), idx=0;
  function slides(){return data.photos.length?data.photos:[null,null,null]}
  function showSlide(){
    var s=slides(), f=$('galFrame'); f.textContent=''; f.style.setProperty('--r',(idx%2?2:-2)+'deg');
    var pol=document.createElement('div'); pol.className='pol';
    if(s[idx]){var im=document.createElement('img'); im.src=s[idx]; im.alt='Litrato '+(idx+1); pol.appendChild(im);}
    else{var ph=document.createElement('div'); ph.className='ph'; ph.textContent='♥'; pol.appendChild(ph);}
    var cp=document.createElement('div'); cp.className='cap'; cp.textContent=s[idx]?'':'Dito ilalagay ang litrato'; pol.appendChild(cp);
    f.appendChild(pol); $('galCount').textContent=(idx+1)+' / '+s.length;
    var end=idx===s.length-1; $('hb').hidden=!end; if(end)startFW(); else stopFW();
  }
  function openGal(){idx=0; showSlide(); gal.hidden=false;}
  function go(d){var n=slides().length; idx=(idx+d+n)%n; showSlide();}
  $('galPrev').addEventListener('click',function(){go(-1)});
  $('galNext').addEventListener('click',function(){go(1)});
  $('galClose').addEventListener('click',function(){gal.hidden=true; stopFW();});
  gal.addEventListener('click',function(e){if(e.target===gal){gal.hidden=true; stopFW();}});
  function savePhotos(){try{localStorage.setItem('sobre-photos',JSON.stringify(data.photos))}catch(e){}}
  function renderThumbs(){
    var t=$('thumbs'); t.textContent='';
    data.photos.forEach(function(src,i){
      var b=document.createElement('button'); b.type='button'; b.className='th';
      b.style.backgroundImage='url("'+src+'")'; b.textContent='✕'; b.setAttribute('aria-label','Alisin ang litrato '+(i+1));
      b.addEventListener('click',function(){data.photos.splice(i,1); savePhotos(); renderThumbs();});
      t.appendChild(b);
    });
  }
  $('fPics').addEventListener('change',function(){
    var files=Array.prototype.slice.call(this.files); this.value='';
    files.forEach(function(f){
      var rd=new FileReader();
      rd.onload=function(){var im=new Image(); im.onload=function(){
        var sc=Math.min(1,900/Math.max(im.width,im.height)), c=document.createElement('canvas');
        c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        if(data.photos.length<8){data.photos.push(c.toDataURL('image/jpeg',.75)); savePhotos(); renderThumbs();}
      }; im.src=rd.result;};
      rd.readAsDataURL(f);
    });
  });
  renderThumbs();

  // fireworks
  var cv=$('fw'), cx=cv.getContext('2d'), fwOn=false, parts=[], rockets=[], raf=0, last=0, nextL=0;
  function fit(){var d=window.devicePixelRatio||1; cv.width=innerWidth*d; cv.height=innerHeight*d; cx.setTransform(d,0,0,d,0,0);}
  function explode(x,y){
    var hue=Math.random()*360, heart=Math.random()<.35, n=heart?60:80;
    for(var i=0;i<n;i++){
      var vx,vy;
      if(heart){var t=i/n*6.283; vx=16*Math.pow(Math.sin(t),3)*.17; vy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*.17;}
      else{var a=Math.random()*6.283, sp=1+Math.random()*4.2; vx=Math.cos(a)*sp; vy=Math.sin(a)*sp;}
      parts.push({x:x,y:y,vx:vx,vy:vy,life:1,c:'hsl('+(hue+Math.random()*40)+',100%,'+(60+Math.random()*15)+'%)'});
    }
  }
  function loop(t){
    if(!fwOn) return;
    var k=Math.min(2.5,(t-last)/16.7||1); last=t;
    cx.globalCompositeOperation='destination-out'; cx.fillStyle='rgba(0,0,0,.22)'; cx.fillRect(0,0,innerWidth,innerHeight);
    cx.globalCompositeOperation='lighter';
    if(t>nextL){rockets.push({x:innerWidth*(.12+Math.random()*.76),y:innerHeight,ty:innerHeight*(.12+Math.random()*.38),vy:-(8+Math.random()*3)}); nextL=t+450+Math.random()*700;}
    rockets=rockets.filter(function(r){r.y+=r.vy*k; cx.globalAlpha=1; cx.fillStyle='#ffe9b0'; cx.fillRect(r.x-1.5,r.y,3,8); if(r.y<=r.ty){explode(r.x,r.y);return false} return true});
    parts=parts.filter(function(p){p.x+=p.vx*k; p.y+=p.vy*k; p.vy+=.045*k; p.vx*=.985; p.life-=.011*k; if(p.life<=0)return false; cx.globalAlpha=p.life; cx.fillStyle=p.c; cx.beginPath(); cx.arc(p.x,p.y,2.2,0,6.283); cx.fill(); return true});
    cx.globalAlpha=1;
    raf=requestAnimationFrame(loop);
  }
  function startFW(){if(reduce||fwOn) return; fwOn=true; fit(); parts=[]; rockets=[]; last=performance.now(); nextL=0; raf=requestAnimationFrame(loop);}
  function stopFW(){fwOn=false; cancelAnimationFrame(raf); parts=[]; rockets=[]; if(cx) cx.clearRect(0,0,cv.width,cv.height);}
  window.addEventListener('resize',function(){if(fwOn)fit()});

  // ambient hearts
  var cols=['#e63b5f','#ff7a93','#c9184a','#ff9eb3','#f25c7a'];
  for(var i=0;i<14;i++){
    var h=document.createElement('span'); h.textContent='♥';
    h.style.setProperty('--x',(Math.random()*96)+'%'); h.style.setProperty('--s',(14+Math.random()*22)+'px');
    h.style.setProperty('--c',cols[i%cols.length]); h.style.setProperty('--d',(9+Math.random()*8)+'s');
    h.style.setProperty('--dl',(-Math.random()*14)+'s'); $('amb').appendChild(h);
  }

  function burst(n,spread){
    if(reduce) return;
    var r=env.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
    for(var i=0;i<n;i++){
      var h=document.createElement('span'); h.className='h'; h.textContent='♥';
      h.style.left=cx+'px'; h.style.top=cy+'px'; h.style.fontSize=(16+Math.random()*28)+'px'; h.style.color=cols[i%cols.length];
      document.body.appendChild(h);
      var dx=(Math.random()-.5)*spread, dy=-(180+Math.random()*340), rot=(Math.random()-.5)*60;
      var a=h.animate([
        {transform:'translate(-50%,-50%) scale(.3)',opacity:0},
        {opacity:1,offset:.15},
        {transform:'translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px)) rotate('+rot+'deg) scale(1)',opacity:0}
      ],{duration:2200+Math.random()*1600,delay:i*50,easing:'cubic-bezier(.2,.6,.3,1)',fill:'both'});
      a.onfinish=(function(el){return function(){el.remove()}})(h);
    }
  }

  var busy=false,isOpen=false,tr=null,tick=null;
  function later(f,t){tr.push(setTimeout(f,t))}
  function open(){
    if(busy||isOpen) return; busy=true; isOpen=true; tr=[];
    env.setAttribute('aria-expanded','true');
    env.classList.add('open'); burst(32,360);
    later(function(){env.classList.add('rise')},500);
    later(function(){env.classList.add('front')},1150);
    later(function(){env.classList.add('read')},1250);
    later(function(){busy=false; tick=setInterval(function(){burst(3,260)},1100)},2300);
  }
  function close(){
    if(busy||!isOpen) return; busy=true; clearInterval(tick); tr=[];
    env.classList.remove('read');
    later(function(){env.classList.remove('front','rise')},1100);
    later(function(){env.classList.remove('open'); isOpen=false; busy=false; env.setAttribute('aria-expanded','false')},2100);
  }
  env.addEventListener('click',open);
  env.addEventListener('keydown',function(e){if(e.target===env&&(e.key==='Enter'||e.key===' ')){e.preventDefault();open()}});
  $('again').addEventListener('click',function(e){e.stopPropagation();close()});
})();
</script>
